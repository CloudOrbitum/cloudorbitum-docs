        <p style="margin: 0 0 14px; font-size: 16px; line-height: 1.7; color: var(--sub2)">How you reach us depends on your plan. Every plan can use the community; Team and Enterprise plans can open support cases.</p>
        <h2 id="plans" style="margin: 40px 0 12px; font-size: 22px; font-weight: 600; scroll-margin-top: 16px; margin-top: 16px">Support by plan</h2>
        <div class="dtable" role="region" aria-label="Table" tabindex="0"><table><thead><tr><th>Plan</th><th>How to reach us</th><th>First response</th></tr></thead><tbody><tr><td>Explorer (free)</td><td>Community forum and Discord</td><td>Best effort</td></tr><tr><td>Team</td><td>Support case from the console or email</td><td>Within 1 business day</td></tr><tr><td>Enterprise</td><td>Support case, phone and a named engineer, 24/7</td><td>Within 1 h for Critical</td></tr></tbody></table></div>
        <h2 id="before" style="margin: 40px 0 12px; font-size: 22px; font-weight: 600; scroll-margin-top: 16px">Before you contact us</h2>
        <ol style="margin: 0; padding-left: 22px; font-size: 16px; line-height: 1.8; color: var(--sub2)">
          <li>Check <a href="Support.html" style="color: var(--text)">Orbitum status</a> for an ongoing incident.</li>
          <li>Search <a href="Error403.html" style="color: var(--text)">Troubleshooting</a> for the error you see.</li>
          <li>Collect a support bundle, so we can see what you see.</li>
        </ol>
        <h2 id="bundle" style="margin: 40px 0 12px; font-size: 22px; font-weight: 600; scroll-margin-top: 16px">Collect a support bundle</h2>
        <p style="margin: 0 0 14px; font-size: 16px; line-height: 1.7; color: var(--sub2)">The bundle contains your CLI version, the last 200 API request IDs and the account’s connection health. It never contains keys or resource data.</p>
        <figure class="cfig term" data-lang="sh"><pre><span class="line"><span class="t-fn">orb</span> support bundle <span class="t-const">--account</span> acme-demo <span class="t-const">--out</span> bundle.zip</span></pre><button type="button" class="ccopy" aria-label="Copy code to clipboard"><svg viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M216 32H88a8 8 0 0 0-8 8v40H40a8 8 0 0 0-8 8v128a8 8 0 0 0 8 8h128a8 8 0 0 0 8-8v-40h40a8 8 0 0 0 8-8V40a8 8 0 0 0-8-8m-56 176H48V96h112Zm48-48h-32V88a8 8 0 0 0-8-8H96V48h112Z"></path></svg></button></figure>
        <figure class="cfig titled"><figcaption class="ctitle"><span class="nm">Output</span><span class="lg">text</span></figcaption><pre><span class="line">Collected 200 request IDs, 4 connections, CLI 2.4.0</span><span class="line">Wrote bundle.zip (38 KB). Attach it to your support case.</span></pre><button type="button" class="ccopy" aria-label="Copy code to clipboard"><svg viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M216 32H88a8 8 0 0 0-8 8v40H40a8 8 0 0 0-8 8v128a8 8 0 0 0 8 8h128a8 8 0 0 0 8-8v-40h40a8 8 0 0 0 8-8V40a8 8 0 0 0-8-8m-56 176H48V96h112Zm48-48h-32V88a8 8 0 0 0-8-8H96V48h112Z"></path></svg></button></figure>
        <h2 id="open" style="margin: 40px 0 12px; font-size: 22px; font-weight: 600; scroll-margin-top: 16px">Open a support case</h2>
        <ol style="margin: 0; padding-left: 22px; font-size: 16px; line-height: 1.8; color: var(--sub2)">
          <li>In the console, go to <b style="color: var(--text)">Help</b> &gt; <b style="color: var(--text)">Contact support</b>.</li>
          <li>Pick the product and a severity from the table below.</li>
          <li>Describe what happened, what you expected and when it started.</li>
          <li>Attach <code class="ic">bundle.zip</code> and any request IDs.</li>
        </ol>
        <h2 id="severity" style="margin: 40px 0 12px; font-size: 22px; font-weight: 600; scroll-margin-top: 16px">Choose a severity</h2>
        <div class="dtable" role="region" aria-label="Table" tabindex="0"><table><thead><tr><th>Severity</th><th>When to use it</th><th>Enterprise target</th></tr></thead><tbody><tr><td><span class="pill bad">Critical</span></td><td>Production is down or data is exposed, and there is no workaround</td><td>1 h, 24/7</td></tr><tr><td><span class="pill warn">High</span></td><td>A major feature is not working, with a workaround</td><td>4 h</td></tr><tr><td><span class="pill info">Normal</span></td><td>A question or a problem with limited impact</td><td>1 business day</td></tr><tr><td><span class="pill neutral">Low</span></td><td>Feedback or a feature request</td><td>2 business days</td></tr></tbody></table></div>
        <div class="callout" role="note" style="margin-top: 20px"><span>Never share API keys, passwords or customer data in a case. Support will never ask for them.</span></div>
