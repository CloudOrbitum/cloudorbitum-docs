        <div style="margin-bottom: 0px"><h2 style="margin: 0 0 8px; font-size: 30px; line-height: 1.1; font-weight: 500">Understanding agents</h2><p style="margin: 0; font-size: 16px; line-height: 1.6; color: var(--sub)">Common types, concepts and tradeoffs.</p></div>
        <div style="display: flex; flex-direction: column; gap: 16px"><div><h3 style="margin: 0; font-size: 18px; font-weight: 500">Workflow</h3><p style="margin: 4px 0 0; font-size: 14px; color: var(--sub)">Where the agent runs changes how you work with it.</p></div><div style="position: relative; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1px; border: 1px solid var(--line); background: var(--line)"><span aria-hidden="true" style="position: absolute; z-index: 3; width: 14px; height: 14px; box-sizing: border-box; border: 1px solid var(--line3); border-radius: 3px; background: var(--bg); left: -7px; top: -7px"></span><span aria-hidden="true" style="position: absolute; z-index: 3; width: 14px; height: 14px; box-sizing: border-box; border: 1px solid var(--line3); border-radius: 3px; background: var(--bg); right: -7px; top: -7px"></span><span aria-hidden="true" style="position: absolute; z-index: 3; width: 14px; height: 14px; box-sizing: border-box; border: 1px solid var(--line3); border-radius: 3px; background: var(--bg); left: -7px; bottom: -7px"></span><span aria-hidden="true" style="position: absolute; z-index: 3; width: 14px; height: 14px; box-sizing: border-box; border: 1px solid var(--line3); border-radius: 3px; background: var(--bg); right: -7px; bottom: -7px"></span><div style="display: flex; flex-direction: column; padding: 20px; background: var(--panel)"><span aria-hidden="true" style="width: 36px; height: 36px; box-sizing: border-box; margin-bottom: 12px; display: flex; align-items: center; justify-content: center; border: 1px solid var(--line); border-radius: 6px; background: var(--line2); color: var(--sub)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7l5 5l-5 5 M12 19l7 0"></path></svg></span><b style="font-size: 16px; font-weight: 500; margin-bottom: 6px">Terminal</b><p style="margin: 0; font-size: 14px; line-height: 1.6; color: var(--sub)">Runs in a shell. Good for scripts, automation and CI, and for running orb commands directly.</p></div><div style="display: flex; flex-direction: column; padding: 20px; background: var(--panel)"><span aria-hidden="true" style="width: 36px; height: 36px; box-sizing: border-box; margin-bottom: 12px; display: flex; align-items: center; justify-content: center; border: 1px solid var(--line); border-radius: 6px; background: var(--line2); color: var(--sub)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5a1 1 0 0 1 1 -1h16a1 1 0 0 1 1 1v14a1 1 0 0 1 -1 1h-16a1 1 0 0 1 -1 -1z M3 9h18 M8 13l-2 2l2 2 M12 13l2 2l-2 2"></path></svg></span><b style="font-size: 16px; font-weight: 500; margin-bottom: 6px">IDE</b><p style="margin: 0; font-size: 14px; line-height: 1.6; color: var(--sub)">A full editor built around the agent, with visual diffs and multi-file edits.</p></div><div style="display: flex; flex-direction: column; padding: 20px; background: var(--panel)"><span aria-hidden="true" style="width: 36px; height: 36px; box-sizing: border-box; margin-bottom: 12px; display: flex; align-items: center; justify-content: center; border: 1px solid var(--line); border-radius: 6px; background: var(--line2); color: var(--sub)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6.66 18.6c-2.57 0 -4.66 -2.02 -4.66 -4.52c0 -2.5 2.09 -4.52 4.66 -4.52c.39 -1.75 1.78 -3.17 3.64 -3.73c1.86 -.55 3.92 -.13 5.4 1.11c1.48 1.24 2.14 3.1 1.75 4.85h.99c1.92 0 3.48 1.56 3.48 3.48c0 1.92 -1.56 3.48 -3.48 3.48h-11.78"></path></svg></span><b style="font-size: 16px; font-weight: 500; margin-bottom: 6px">Cloud</b><p style="margin: 0; font-size: 14px; line-height: 1.6; color: var(--sub)">Runs on hosted machines. Suited to long tasks that finish while you are away.</p></div><div style="display: flex; flex-direction: column; padding: 20px; background: var(--panel)"><span aria-hidden="true" style="width: 36px; height: 36px; box-sizing: border-box; margin-bottom: 12px; display: flex; align-items: center; justify-content: center; border: 1px solid var(--line); border-radius: 6px; background: var(--line2); color: var(--sub)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h3a1 1 0 0 0 1 -1v-1a2 2 0 0 1 4 0v1a1 1 0 0 0 1 1h3a1 1 0 0 1 1 1v3a1 1 0 0 0 1 1h1a2 2 0 0 1 0 4h-1a1 1 0 0 0 -1 1v3a1 1 0 0 1 -1 1h-3a1 1 0 0 1 -1 -1v-1a2 2 0 0 0 -4 0v1a1 1 0 0 1 -1 1h-3a1 1 0 0 1 -1 -1v-3a1 1 0 0 1 1 -1h1a2 2 0 0 0 0 -4h-1a1 1 0 0 1 -1 -1v-3a1 1 0 0 1 1 -1"></path></svg></span><b style="font-size: 16px; font-weight: 500; margin-bottom: 6px">Extension</b><p style="margin: 0; font-size: 14px; line-height: 1.6; color: var(--sub)">Adds an agent to the editor you already use. The lightest install.</p></div></div></div>
        <div style="display: flex; flex-direction: column; gap: 16px"><div><h3 style="margin: 0; font-size: 18px; font-weight: 500">Key concepts</h3><p style="margin: 4px 0 0; font-size: 14px; color: var(--sub)">The words you will meet when comparing agents.</p></div><div style="position: relative; display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 1px; border: 1px solid var(--line); background: var(--line)"><span aria-hidden="true" style="position: absolute; z-index: 3; width: 14px; height: 14px; box-sizing: border-box; border: 1px solid var(--line3); border-radius: 3px; background: var(--bg); left: -7px; top: -7px"></span><span aria-hidden="true" style="position: absolute; z-index: 3; width: 14px; height: 14px; box-sizing: border-box; border: 1px solid var(--line3); border-radius: 3px; background: var(--bg); right: -7px; top: -7px"></span><span aria-hidden="true" style="position: absolute; z-index: 3; width: 14px; height: 14px; box-sizing: border-box; border: 1px solid var(--line3); border-radius: 3px; background: var(--bg); left: -7px; bottom: -7px"></span><span aria-hidden="true" style="position: absolute; z-index: 3; width: 14px; height: 14px; box-sizing: border-box; border: 1px solid var(--line3); border-radius: 3px; background: var(--bg); right: -7px; bottom: -7px"></span><div style="display: flex; flex-direction: column; padding: 20px; background: var(--panel)"><b style="font-size: 16px; font-weight: 500; margin-bottom: 6px">Skills</b><p style="margin: 0; font-size: 14px; line-height: 1.6; color: var(--sub)">Packaged instructions that teach an agent one domain, often with slash commands. The Orbitum skill teaches graph queries and runbooks.</p></div><div style="display: flex; flex-direction: column; padding: 20px; background: var(--panel)"><b style="font-size: 16px; font-weight: 500; margin-bottom: 6px">MCP</b><p style="margin: 0; font-size: 14px; line-height: 1.6; color: var(--sub)">The Model Context Protocol lets agents call outside tools. The Orbitum MCP server exposes the graph, alerts and runbooks.</p></div><div style="display: flex; flex-direction: column; padding: 20px; background: var(--panel)"><b style="font-size: 16px; font-weight: 500; margin-bottom: 6px">Model flexibility</b><p style="margin: 0; font-size: 14px; line-height: 1.6; color: var(--sub)">Which models an agent can use: only the vendor's own (locked), your own API key (BYOK), or several providers.</p></div><div style="display: flex; flex-direction: column; padding: 20px; background: var(--panel)"><b style="font-size: 16px; font-weight: 500; margin-bottom: 6px">Context</b><p style="margin: 0; font-size: 14px; line-height: 1.6; color: var(--sub)">How an agent remembers your project: only the current session, saved project memory, or an index of the whole repository.</p></div></div></div>

ter; gap: 8px; margin-bottom: 8px; font-size: 16px; font-weight: 500"><span>Proprietary</span><span style="font-size: 12px; font-weight: 400; color: var(--sub)">vs.</span><span>Open source</span></div><p style="margin: 0; font-size: 14px; line-height: 1.6; color: var(--sub)">Proprietary agents ship under a closed licence. Open-source agents publish their code, so you can read, change or fork it.</p></div><div style="display: flex; flex-direction: column; padding: 20px; background: var(--panel)"><div style="display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 16px; font-weight: 500"><span>Locked model</span><span style="font-size: 12px; font-weight: 400; color: var(--sub)">vs.</span><span>BYOK</span></div><p style="margin: 0; font-size: 14px; line-height: 1.6; color: var(--sub)">Locked agents use only the vendor's models. Bring-your-own-key agents let you switch providers and models.</p></div><div style="display: flex; flex-direction: column; padding: 20px; background: var(--panel)"><div style="display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 16px; font-weight: 500"><span>Session</span><span style="font-size: 12px; font-weight: 400; color: var(--sub)">vs.</span><span>Indexed codebase</span></div><p style="margin: 0; font-size: 14px; line-height: 1.6; color: var(--sub)">Session context resets when the conversation ends. An indexed codebase persists and lets the agent find any file.</p></div></div></div>
