      <header style="display: flex; flex-direction: column; gap: 12px">
        <h1>Query the graph</h1>
        <div class="cline" style="max-width: none"><code style="display: flex; align-items: center; gap: 10px; padding: 10px 12px"><span class="pill info method">POST</span>/v1/accounts/{account_id}/graph/query</code><button type="button" aria-label="Copy to clipboard"><svg viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M216 32H88a8 8 0 0 0-8 8v40H40a8 8 0 0 0-8 8v128a8 8 0 0 0 8 8h128a8 8 0 0 0 8-8v-40h40a8 8 0 0 0 8-8V40a8 8 0 0 0-8-8m-56 176H48V96h112Zm48-48h-32V88a8 8 0 0 0-8-8H96V48h112Z"></path></svg></button></div>
        <p class="sub">Run a query against the resource graph and get back resources, relationships or paths. Results match what the live map shows at the time of the call.</p>
        <div style="display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 13px; color: var(--sub)">
          Required scope <code class="ic">graph:read</code><span style="margin-left: 10px">Rate limit</span> <span class="badge">600 requests per minute</span>
        </div>
      </header>
      <section style="display: flex; flex-direction: column; gap: 10px"><h2>Path parameters</h2><div class="dtable" role="region" aria-label="Table" tabindex="0"><table><thead><tr><th>Name</th><th>Description</th></tr></thead><tbody><tr><td><code class="ic">account_id</code><span class="ty">string · required</span></td><td>The Orbitum account to query, for example <code class="ic">acme-demo</code></td></tr></tbody></table></div></section>
      <section style="display: flex; flex-direction: column; gap: 10px"><h2>Body</h2><div class="dtable" role="region" aria-label="Table" tabindex="0"><table><thead><tr><th>Field</th><th>Description</th></tr></thead><tbody><tr><td><code class="ic">query</code><span class="ty">string · required</span></td><td>The query, in Orbitum query language. See <a href="Docs.html">writing queries</a></td></tr><tr><td><code class="ic">include</code><span class="ty">array · optional</span></td><td>Extra fields per resource: <code class="ic">cost</code>, <code class="ic">carbon</code>, <code class="ic">score</code>, <code class="ic">source</code></td></tr><tr><td><code class="ic">limit</code><span class="ty">integer · optional</span></td><td>Rows per page, 1 to 500. Default 100</td></tr><tr><td><code class="ic">tenant</code><span class="ty">string · optional</span></td><td>Query a sandbox tenant instead. Results carry <code class="ic">simulated: true</code> <span class="simulated">SIMULATED</span></td></tr></tbody></table></div></section>
      <section style="display: flex; flex-direction: column; gap: 10px"><h2>Responses</h2><div class="dtable" role="region" aria-label="Table" tabindex="0"><table><thead><tr><th>Status</th><th>Meaning</th></tr></thead><tbody><tr><td><span class="pill ok">200</span></td><td>The query ran. Rows, a count and when the data was last refreshed</td></tr><tr><td><span class="pill warn">400</span></td><td>The query could not be read. The error points to the position that failed</td></tr><tr><td><span class="pill bad">403</span></td><td>The key does not have <code class="ic">graph:read</code> for this account</td></tr><tr><td><span class="pill neutral">429</span></td><td>Rate limit reached. Retry after the seconds in <code class="ic">Retry-After</code></td></tr></tbody></table></div></section>
    </article>
