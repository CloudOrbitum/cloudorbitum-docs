    var list = q ? all.filter(function (p) { return (p.title + ' ' + p.desc).toLowerCase().indexOf(q) >= 0; }) : all.slice(0, 3);
    var active = Math.min(st.active, Math.max(list.length - 1, 0));
    var close = function () { if (self.props.onClose) self.props.onClose(); };
    var shown = list.map(function (p, i) {
      var on = i === active, starred = !!st.stars[p.id];
      return { id: p.id, title: p.title, desc: p.desc, href: p.href, cls: on ? 'sdlg-item on' : 'sdlg-item', sel: on ? 'true' : 'false',
        starred: starred ? 'true' : 'false', starFill: starred ? 'currentColor' : 'none', starLabel: starred ? 'Remove from favourites' : 'Add to favourites',
        enter: function () { if (self.state.active !== i) self.setState({ active: i }); },
        toggleStar: function (e) { e.stopPropagation(); var s = Object.assign({}, self.state.stars); s[p.id] = !s[p.id]; self.setState({ stars: s }); } };
    });
    return {
      open: this.props.open === undefined ? true : !!this.props.open,
      theme: this.props.theme || '',
      q: st.q, shown: shown, empty: q && list.length === 0, section: q ? 'Results' : 'Recent',
      activeId: list[active] ? list[active].id : '',
      setInput: function (el) { if (el && !self._focused) { self._focused = true; setTimeout(function () { try { el.focus(); } catch (e) {} }, 30); } },
      onInput: function (e) { self.setState({ q: e.target.value, active: 0 }); },
      onKey: function (e) {
        if (e.key === 'ArrowDown') { e.preventDefault(); self.setState({ active: Math.min(active + 1, list.length - 1) }); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); self.setState({ active: Math.max(active - 1, 0) }); }
        else if (e.key === 'Enter') { e.preventDefault(); var el = list[active] && document.getElementById(list[active].id); if (el) el.click(); }
        else if (e.key === 'Escape') { e.preventDefault(); close(); }
      },
      onScrim: function () { close(); },
      stop: function (e) { e.stopPropagation(); }
    };
  }
}
</script>
