<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search dialog · Orbitum developer docs</title>
<meta charset="utf-8">
<link rel="stylesheet" href="../css/orbitum-devsite.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&amp;display=swap">

<body>
<div id="dc-root"></div>
<template data-dc-main>
<div class="orb dev {{theme}}" style="font-family: var(--font-sans); color: var(--text)">
<sc-if value="{{open}}" hint-placeholder-val="{{ true }}">
<div class="sdlg-scrim" onClick="{{onScrim}}">
  <div class="sdlg" role="dialog" aria-modal="true" aria-label="Search documentation" onClick="{{stop}}">
    <label class="sdlg-in">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 10m-7 0a7 7 0 1 0 14 0a7 7 0 1 0 -14 0 M21 21l-6 -6"></path></svg>
      <input type="search" ref="{{setInput}}" value="{{q}}" onInput="{{onInput}}" onKeyDown="{{onKey}}" placeholder="Search documentation…" aria-label="Search documentation" aria-controls="sdlg-results" aria-activedescendant="{{activeId}}" autocomplete="off">
    </label>
    <div class="sdlg-list" id="sdlg-results" role="listbox" aria-label="{{section}}">
      <div class="sdlg-sec"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 8v4l2 2 M3.05 11a9 9 0 1 1 .5 4 M3 4v5h5"></path></svg><span>{{section}}</span></div>
      <sc-if value="{{empty}}" hint-placeholder-val="{{ false }}"><div class="sdlg-empty">No results for “{{q}}”. Try another word.</div></sc-if>
      <sc-for list="{{shown}}" as="it" hint-placeholder-count="3">
        <div class="{{it.cls}}" role="option" aria-selected="{{it.sel}}" onMouseEnter="{{it.enter}}" style="grid-template-columns: minmax(0, 1fr) 36px">
          <a id="{{it.id}}" href="{{it.href}}" style="display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 12px; min-width: 0; color: inherit; text-decoration: none">
          <span class="hs"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 9l14 0 M5 15l14 0 M11 4l-4 16 M17 4l-4 16"></path></svg></span>
          <span style="min-width: 0"><b>{{it.title}}</b><span style="display: -webkit-box; margin-top: 6px; font-size: 14.5px; line-height: 1.6; color: var(--sub); -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden">{{it.desc}}</span></span>
          </a>
          <button type="button" class="sdlg-star" aria-label="{{it.starLabel}}" aria-pressed="{{it.starred}}" onClick="{{it.toggleStar}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="{{it.starFill}}" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 17.75l-6.17 3.24l1.18 -6.87l-5 -4.86l6.9 -1l3.09 -6.26l3.09 6.26l6.9 1l-5 4.86l1.18 6.87z"></path></svg></button>
        </div>
      </sc-for>
    </div>
    <div class="sdlg-foot">
      <span class="k"><span class="sdlg-kbd">↑</span><span class="sdlg-kbd">↓</span>Navigate</span>
      <span class="k"><span class="sdlg-kbd">↵</span>Select</span>
      <span class="k"><span class="sdlg-kbd">Esc</span>Close</span>
      <span style="flex: 1"></span>
      <span class="k">Powered by Orbitum search <span class="logo" aria-hidden="true" style="width: 16px; height: 16px; margin: 0 0 0 4px"><i style="left: 3px; top: 3px; width: 6px; height: 6px"></i></span></span>
    </div>
  </div>
</div>
</sc-if>
</div>
</template>

rbitum status and popular answers."}, {"id": "r11", "title": "Contacting Orbitum Support", "href": "ContactSupport.html", "desc": "Support by plan, response times, the support bundle and how to open a case."}];

</html>
