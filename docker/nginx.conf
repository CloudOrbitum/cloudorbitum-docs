server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Astro builds /foo/ as /foo/index.html.
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Agent-readable Markdown alternates (/<page>/index.md, /llms.txt).
    location ~* \.(md|mdx)$ {
        default_type text/markdown;
        charset utf-8;
    }
    location ~* \.txt$ {
        default_type text/plain;
        charset utf-8;
    }

    # Hashed build assets never change.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    error_page 404 /404.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/markdown text/plain;
}
